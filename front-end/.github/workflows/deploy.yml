name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main  # Đổi thành 'master' nếu branch chính của bạn tên là master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m      # <-- TĂNG THỜI GIAN CHỜ LÊN 30 PHÚT
          timeout: 60s
          script_stop: true
          script: |
            echo "==> 1. Kéo code mới nhất..."
            cd /var/www/eduQuiz/quiz-frontend
            git pull origin main

            echo "==> 2. Build lại Frontend (no-cache)..."
            cd /var/www/eduQuiz
            docker compose build --no-cache frontend
            docker compose up -d frontend

            echo "==> 3. Dọn dẹp images rác..."
            docker image prune -f

            echo "==> Deploy Frontend thành công!"
